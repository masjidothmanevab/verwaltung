<title>Othman Moschee Verwaltung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>
:root{--bg:#f3f5f3;--card:#fff;--fg:#13211b;--muted:#5a6a62;--edge:#d9e0db;--accent:#1f8a5c;--warn:#b4731c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a16;--card:#15231e;--fg:#eef3ef;--muted:#9fb0a7;--edge:#24352e;--accent:#36a874;--warn:#bf862c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,sans-serif;font-size:15px;line-height:1.45;padding:16px}
.ar{display:block;direction:rtl;unicode-bidi:plaintext;text-align:left;font-family:"IBM Plex Sans Arabic","Inter",sans-serif;color:var(--muted);font-size:.95em;margin-top:2px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:28px 26px;display:grid;gap:16px}
h1{margin:0;font-size:20px;font-weight:600}
p{margin:0;color:var(--muted);font-size:14px}
label{font-size:13px;color:var(--muted);display:block}
input[type=password]{width:100%;margin-top:6px;padding:11px 12px;font:inherit;font-size:16px;border:1px solid var(--edge);border-radius:10px;background:var(--bg);color:var(--fg)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
button{width:100%;padding:12px;font:inherit;font-size:15px;font-weight:600;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{display:none;color:var(--warn);font-size:14px}
.err.on{display:block}
footer{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div>
    <h1>Othman Moschee · Verwaltung<span class="ar">مسجد عثمان · الإدارة</span></h1>
    <p style="margin-top:6px">Interner Bereich. Bitte Passwort eingeben.<span class="ar">منطقة داخلية. يرجى إدخال كلمة المرور.</span></p>
  </div>
  <label>Passwort<span class="ar">كلمة المرور</span>
    <input type="password" id="pw" required autofocus autocomplete="current-password">
  </label>
  <label class="row"><input type="checkbox" id="keep" checked> <span>Auf diesem Gerät angemeldet bleiben<span class="ar">البقاء مسجلاً على هذا الجهاز</span></span></label>
  <div class="err" id="err">Falsches Passwort.<span class="ar">كلمة المرور غير صحيحة.</span></div>
  <button id="go" type="submit">Öffnen · فتح</button>
  <footer>Verbindung verschlüsselt · الاتصال مشفّر</footer>
</form>

const hex = s => Uint8Array.from(s.match(/../g), h => parseInt(h, 16));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = 'verwaltung-key-' + B.salt;
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt: hex(B.salt), iterations: B.it}, base, 256));
}
async function decrypt(raw){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: hex(B.iv)}, key, b64(B.ct));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
(async () => { try { const k = localStorage.getItem(KEY); if (k) show(await decrypt(hex(k))); } catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} } })();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.classList.remove('on');
  try {
    const raw = await derive(document.getElementById('pw').value);
    const html = await decrypt(raw);
    if (document.getElementById('keep').checked) { try { localStorage.setItem(KEY, [...raw].map(b => b.toString(16).padStart(2, '0')).join('')); } catch (_) {} }
    show(html);
  } catch (e) { err.classList.add('on'); btn.disabled = false; document.getElementById('pw').select(); }
});
